<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Контакты">
  <title>Контакты — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-logo" href="index.html">ShopProject</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="index.html">Главная</a></li>
          <li><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li><a class="site-nav__link" href="order.html">Заявка</a></li>
          <li><a class="site-nav__link site-nav__link--active" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 class="section__title">Контакты</h1>

      <div class="aside-info">
        <p><strong>Email:</strong> shop@example.com</p>
        <p><strong>Телефон:</strong> +7 (900) 123-45-67</p>
        <p><strong>Адрес:</strong> г. Москва, ул. Учебная, д. 1</p>
      </div>

      <h2>Напишите нам</h2>
      <form action="#" method="post" style="max-width: 500px;">
        <div class="form-field">
          <label for="contact-name">Имя</label>
          <input id="contact-name" name="name" type="text" required>
        </div>
        <div class="form-field">
          <label for="contact-email">E-mail</label>
          <input id="contact-email" name="email" type="email" required>
        </div>
        <div class="form-field">
          <label for="contact-message">Сообщение</label>
          <textarea id="contact-message" name="message" rows="4" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="button">Отправить</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; 2026 Учебный проект</p>
    </div>
  </footer>

  <a href="#" class="button-up" title="Наверх">↑</a>

</body>
</html>
